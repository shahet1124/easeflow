name: Feature request
description: Suggest a new rule, metric, deliverable or workflow change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What does EaseFlow miss or do poorly today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: What should change, and in which file or phase?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Research, a real run, or a real user test that supports this.
  - type: checkboxes
    id: promises
    attributes:
      label: Core promises
      options:
        - label: This keeps every feature (nothing lost)
          required: true
        - label: This keeps code changes approval-only
          required: true
        - label: This works for any product type
          required: true
